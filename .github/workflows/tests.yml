# PR과 main에 올라온 변경마다 check_merge.py check(등록 점검 + pytest)를 돌린다.
# 외부 서비스(Supabase·Redis·Gemini) 없이 도는 테스트라 비밀값이 필요 없다.
name: tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check_merge
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            frontend/requirements.txt

      - name: 의존성 설치
        run: pip install -r backend/requirements.txt -r frontend/requirements.txt

      - name: 등록 점검 + 테스트 (check_merge.py check)
        run: python backend/scripts/check_merge.py check

      - name: requirements.txt가 requirements/*.txt와 맞는지 확인
        run: |
          if ! git diff --exit-code backend/requirements.txt frontend/requirements.txt; then
            echo "::error::requirements/*.txt를 바꾼 뒤 'python backend/scripts/check_merge.py check'로 requirements.txt를 다시 만들어 함께 커밋하세요."
            exit 1
          fi

      - name: 점검 보고서 출력
        if: always()
        run: cat merge_report.txt || true
